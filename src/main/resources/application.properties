spring.application.name=server
spring.docker.compose.enabled=true
spring.docker.compose.file=compose-dev.yaml

server.port=${SERVER_PORT:8080}

# Swagger/Open API documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
machikoro.db.init.enabled=true
# Set to true in dev to enable POST /debug/seed
debug.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:machikoro}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

# Springwolf
springwolf.enabled=true
springwolf.docket.base-package=org.machikoro.server
springwolf.docket.info.title=${spring.application.name}
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=Machikoro game server STOMP API

# STOMP server entry — points to your WebSocket endpoint
springwolf.docket.servers.ws.protocol=websocket
springwolf.docket.servers.ws.host=localhost:${server.port:8080}
springwolf.docket.servers.ws.pathname=/ws