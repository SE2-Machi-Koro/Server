spring.application.name=server
spring.docker.compose.enabled=true
spring.docker.compose.file=compose-dev.yaml

server.port=${SERVER_PORT:8080}

# Graceful shutdown: on SIGTERM (e.g. Railway redeploy) let in-flight requests
# finish and WebSocket sessions close cleanly instead of being killed abruptly.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Swagger/Open API documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
machikoro.db.init.enabled=true
# Enable debug endpoints via env var — off by default for safety
debug.enabled=${DEBUG_ENABLED:false}
# Password for the 4 seeded admin accounts — required when debug.enabled=true
admin.password=${ADMIN_PASSWORD:}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:machikoro}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
# Connection longevity/resilience: retire connections before a managed Postgres
# or proxy drops them idle, and keep idle ones validated. keepalive-time must be
# < max-lifetime. Conservative values (below typical managed-DB idle timeouts).
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
# Liveness/readiness probes (Spring Boot availability state).
# Readiness includes the DB so traffic is gated until the database is reachable;
# liveness deliberately excludes it so a transient DB blip restarts no container.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

# Springwolf
springwolf.enabled=true
springwolf.docket.base-package=org.machikoro.server
springwolf.docket.info.title=${spring.application.name}
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=Machikoro game server STOMP API

# STOMP server entry — points to your WebSocket endpoint
springwolf.docket.servers.ws.protocol=websocket
springwolf.docket.servers.ws.host=localhost:${server.port:8080}
springwolf.docket.servers.ws.pathname=/ws