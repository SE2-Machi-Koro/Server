services:
  postgres:
    container_name: 'machikoro-db'
    image: 'postgres:18.0'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=${DB_NAME:-machikoro}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME}'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-machikoro}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgAdmin:
    container_name: 'machikoro-pgadmin'
    image: 'dpage/pgadmin4:8.4'
    restart: unless-stopped
    environment:
      - 'PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}'
      - 'PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}'
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    container_name: 'machikoro-server'
    build: .
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-8080}:8080'
    environment:
      - 'DB_HOST=postgres'
      - 'DB_PORT=5432'
      - 'DB_NAME=${DB_NAME:-machikoro}'
      - 'DB_USERNAME=${DB_USERNAME}'
      - 'DB_PASSWORD=${DB_PASSWORD}'
      - 'SERVER_PORT=${SERVER_PORT:-8080}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  pgadmin_data: