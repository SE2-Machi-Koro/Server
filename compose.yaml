services:
  postgres:
    container_name: 'machikoro-db'
    image: 'postgres:latest'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=${DB_NAME:-machikoro}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}'
      - 'POSTGRES_USER=${DB_USERNAME:-postgres}'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-machikoro}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgAdmin:
    container_name: 'machikoro-pgadmin'
    image: 'dpage/pgadmin4:latest'
    restart: unless-stopped
    environment:
      - 'PGADMIN_DEFAULT_EMAIL=admin@admin.com'
      - 'PGADMIN_DEFAULT_PASSWORD=admin'
    ports:
      - '5050:80'
    depends_on:
      - postgres

  backend:
    container_name: 'machikoro-server'
    build: .
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-8080}:8080'
    environment:
      - 'DB_HOST=postgres'
      - 'DB_PORT=5432'
      - 'DB_NAME=${DB_NAME:-machikoro}'
      - 'DB_USERNAME=${DB_USERNAME:-postgres}'
      - 'DB_PASSWORD=${DB_PASSWORD:-postgres}'
      - 'SERVER_PORT=${SERVER_PORT:-8080}'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: