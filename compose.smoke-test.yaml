services:
  postgres:
    container_name: '${SMOKE_POSTGRES_CONTAINER:-machikoro-smoke-db}'
    ports:
      - '${SMOKE_DB_PORT:-55432}:5432'

  backend:
    container_name: '${SMOKE_BACKEND_CONTAINER:-machikoro-smoke-server}'
    image: 'machikoro-server-smoke:local'
    build:
      context: .
      target: final
    pull_policy: never
    ports:
      - '${PUBLIC_PORT:-58080}:8080'
    environment:
      - 'SPRING_DOCKER_COMPOSE_ENABLED=false'
      - 'WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:58080}'
