# Increase heap for the Gradle daemon (used by CI runners and CodeQL autobuild).
# -XX:+UseG1GC keeps GC pauses short under the large heap required by Kotlin
# compilation + test containers + code generation running in parallel.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Increase heap for the Kotlin compile daemon. The default (~512m) is not
# enough to compile this module under CodeQL's instrumented autobuild and
# was causing `OOMErrorException: Not enough memory to run compilation`.
# Heap raised to 8 GB and metaspace capped at 1 GB to prevent OOM during
# large Kotlin compilation tasks (PR #403).
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m

# Enable incremental Kotlin compilation to avoid full recompilation on every
# build, reducing memory pressure and build time (PR #402).
kotlin.incremental=true

# Standard performance flags.
org.gradle.parallel=true
# Disable the Gradle build cache to prevent stale-cache OOM issues under CI
# where cache entries can grow unbounded (PR #402).
org.gradle.caching=false
# Reuse the daemon across invocations to avoid repeated JVM startup costs.
org.gradle.daemon=true
# Reduce parallel workers from 4 → 2 so the Kotlin daemon, test JVM, and
# Gradle daemon can coexist without exhausting CI runner memory (PR #402).
org.gradle.workers.max=2
