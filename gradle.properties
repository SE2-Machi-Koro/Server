# Increase heap for the Gradle daemon (used by CI runners and CodeQL autobuild).
# -XX:+UseG1GC keeps GC pauses short under the large heap required by Kotlin
# compilation + test containers + code generation running in parallel.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Increase heap for the Kotlin compile daemon. The default (~512m) is not
# enough to compile this module under CodeQL's instrumented autobuild and
# was causing `OOMErrorException: Not enough memory to run compilation`.
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Standard performance flags.
org.gradle.parallel=true
org.gradle.caching=true
# Reuse the daemon across invocations to avoid repeated JVM startup costs.
org.gradle.daemon=true
# Cap parallel workers to avoid exhausting CI runner memory when tasks run
# concurrently (Kotlin compile daemon + test JVM + Gradle daemon all coexist).
org.gradle.workers.max=4
