name: Server CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Wichtig für SonarCloud (vollständige Git-History)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle dependency lockfile is up to date
        run: |
          ./gradlew dependencies --write-locks --quiet
          if ! git diff --exit-code -- gradle.lockfile; then
            echo "::error::gradle.lockfile is out of date. Run './gradlew dependencies --write-locks' locally and commit the updated lockfile. If you changed dependencies or versions, also refresh and commit 'gradle/verification-metadata.xml' via './gradlew --write-verification-metadata sha256 build'."
            exit 1
          fi

      - name: Build & Test
        run: ./gradlew clean build test --info --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: build/reports/tests/

  # Deployment is handled by doco-cd on every push to `main`.
  # doco-cd clones the repo to
  #   /var/lib/docker/volumes/doco-cd-setup_data/_data/github.com/<org>/<repo>/
  # on the AAU shared server and runs `docker compose up -d` against
  # `compose.yaml`. Production secrets live in a server-side `.env` placed
  # next to `compose.yaml` (chmod 600). For debugging / rollback use SSH:
  #   ssh grp-6@se2-demo.aau.at -p 53200
