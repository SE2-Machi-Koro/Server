name: Server CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Ensure the Gradle daemon gets enough heap even if gradle.properties is not
  # picked up early (e.g. before the checkout step runs).  This mirrors the
  # org.gradle.jvmargs value in gradle.properties so both paths are covered.
  GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Wichtig für SonarCloud (vollständige Git-History)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle dependency lockfile is up to date
        run: |
          ./gradlew dependencies --write-locks --quiet
          if ! git diff --exit-code -- gradle.lockfile; then
            echo "::error::gradle.lockfile is out of date. Run './gradlew dependencies --write-locks' locally and commit the updated lockfile. If you changed dependencies or versions, also refresh and commit 'gradle/verification-metadata.xml' via './gradlew --write-verification-metadata sha256 build'."
            exit 1
          fi

      - name: Build and test
        run: ./gradlew clean build test --info --stacktrace

  # Deployment is handled by Railway (https://railway.app). On every push to
  # `main` the `docker-publish.yml` workflow pushes a new image to GHCR
  # (ghcr.io/se2-machi-koro/server:latest); Railway watches that image
  # (pull_policy: always) and automatically redeploys the backend service.
  # Production env vars (DB_*, WEBSOCKET_ALLOWED_ORIGINS, ...) are configured in
  # the Railway service settings — see the Deployment section of README.md.
  # The legacy AAU doco-cd/SSH flow is retained only for historical reference.
