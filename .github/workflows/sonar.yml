name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sonar:
    name: Test, Coverage & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle dependency lockfile is present and up to date
        run: |
          test -f gradle.lockfile || {
            echo "::error::gradle.lockfile is missing. Generate it with './gradlew dependencies --write-locks' and commit it."
            exit 1
          }

          ./gradlew dependencies --write-locks --quiet

          if ! git diff --exit-code -- gradle.lockfile; then
            echo "::error::gradle.lockfile is out of date. Run './gradlew dependencies --write-locks' locally and commit the updated lockfile."
            exit 1
          fi

      - name: Run tests, generate JaCoCo and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --no-daemon clean test jacocoTestReport sonar --info --stacktrace

      - name: Upload JaCoCo XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
